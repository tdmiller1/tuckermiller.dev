name: Node CI

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      # This workflow previously ran checkout + setup-node only, so a broken
      # `develop` stayed invisible until it merged to master, where it deploys.
      - name: Build
        run: npm run build
        env:
          CI: true
