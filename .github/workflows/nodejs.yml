name: Node CI and Firebase Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which is what generates package-lock.json locally.
      # On npm 10 (Node 20) `npm ci` rejects that lock: it wants to add
      # postcss-load-config's optional peer `yaml@2`, which npm 11 omits.
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          CI: true
      # Deploy runs exactly once. It previously sat inside a
      # `node-version: [10.x, 12.x]` matrix, so every push to master fired two
      # concurrent `firebase deploy` calls racing to publish the same commit.
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
